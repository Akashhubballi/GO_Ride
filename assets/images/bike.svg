<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" fill="none">
  <!-- Bike / Motorcycle Vector -->
  <defs>
    <linearGradient id="bikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05D374"/>
      <stop offset="100%" stop-color="#00A859"/>
    </linearGradient>
  </defs>
  <!-- Road shadow -->
  <ellipse cx="100" cy="108" rx="85" ry="6" fill="#0B0F19" fill-opacity="0.12"/>
  <!-- Rear Wheel -->
  <circle cx="45" cy="82" r="26" stroke="#1E293B" stroke-width="8" fill="#F8FAFC"/>
  <circle cx="45" cy="82" r="14" stroke="#64748B" stroke-width="2" fill="#0F172A"/>
  <circle cx="45" cy="82" r="5" fill="#05D374"/>
  <!-- Front Wheel -->
  <circle cx="155" cy="82" r="26" stroke="#1E293B" stroke-width="8" fill="#F8FAFC"/>
  <circle cx="155" cy="82" r="14" stroke="#64748B" stroke-width="2" fill="#0F172A"/>
  <circle cx="155" cy="82" r="5" fill="#05D374"/>
  <!-- Frame & Body -->
  <path d="M45 82L80 78L105 52L135 52L155 82" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 78L96 82L125 82L145 65" stroke="#334155" stroke-width="4"/>
  <!-- Engine / Battery -->
  <rect x="82" y="70" width="34" height="20" rx="4" fill="#1E293B"/>
  <path d="M88 77H110" stroke="#05D374" stroke-width="2" stroke-linecap="round"/>
  <!-- Fuel Tank / Body Panels -->
  <path d="M72 60C75 48 95 44 116 46C122 47 128 50 126 58C124 64 100 66 72 60Z" fill="url(#bikeGrad)"/>
  <!-- Seat -->
  <path d="M60 56C65 52 82 50 96 55L92 63C80 60 65 62 60 56Z" fill="#0F172A"/>
  <!-- Handlebars & Mirror -->
  <path d="M128 48L136 34L148 34" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="148" cy="30" r="3" fill="#05D374"/>
  <!-- Headlight -->
  <polygon points="144,48 152,50 148,56" fill="#FCD34D"/>
</svg>
